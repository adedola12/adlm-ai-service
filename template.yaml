AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ADLM AI Service - serverless AI API for the ADLM product suite

Globals:
  Function:
    Timeout: 120
    MemorySize: 1024
    Runtime: nodejs20.x

Parameters:
  MongoUri:
    Type: String
    NoEcho: true
  RategenMongoUri:
    Type: String
    NoEcho: true
    Default: ""
    Description: Zone-priced RateGen admin cluster (read-only grounding).
  JwtLicenseSecret:
    Type: String
    NoEcho: true
    Default: ""
  JwtAccessSecret:
    Type: String
    NoEcho: true
    Default: ""
  AdminApiKey:
    Type: String
    NoEcho: true
  AiProvider:
    Type: String
    # INERT as of 2026-08-15. src/config/index.js now pins aiProvider to "bedrock"
    # and no longer reads AI_PROVIDER, because a deployed AI_PROVIDER=anthropic
    # silently moved every call onto a separately-billed Anthropic account — and
    # when that credit ran dry the assistant died with a misleading "AI service is
    # unreachable". Kept as a parameter so restoring the direct-API fallback stays
    # a one-line change (see src/clients/bedrock.js).
    #
    # The 2026-07-29 outage this comment used to warn about had a different cause
    # than "no model grant": the BEDROCK_MODEL_* ids below were not valid Bedrock
    # inference-profile ids, so Bedrock could never have worked with them.
    Default: bedrock
    AllowedValues: [anthropic, bedrock]
    Description: >-
      bedrock = production target. Model calls bill against the AWS Activate
      credit and the Lambda role's bedrock:InvokeModel policy below, so no
      provider API key is held anywhere. REQUIRES model access granted in the
      Bedrock console for this region, otherwise every call returns 503
      MODEL_UNAVAILABLE. anthropic = direct-API fallback and the safe default;
      it bills cash, not credit.
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ""
  AiAccessMode:
    Type: String
    Default: any-subscription
    AllowedValues: [any-subscription, entitlement]
    Description: >-
      Who gets AI access. any-subscription = any ACTIVE ADLM entitlement (current
      policy while AI is being built out; spend is bounded by quotas and the credit
      guard). entitlement = only the `ai` add-on. Both require an active,
      unexpired entitlement. Flip this without a code change when AI is priced.
  AlarmEmail:
    Type: String
    Default: dolapo836@gmail.com

Resources:
  AiServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: adlm-ai-service
      Handler: src/lambda.handler
      Environment:
        Variables:
          MONGO_URI: !Ref MongoUri
          RATEGEN_MONGO_URI: !Ref RategenMongoUri
          AI_DB: adlm_ai
          JWT_LICENSE_SECRET: !Ref JwtLicenseSecret
          JWT_ACCESS_SECRET: !Ref JwtAccessSecret
          ADMIN_API_KEY: !Ref AdminApiKey
          AI_PROVIDER: !Ref AiProvider
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          AI_ACCESS_MODE: !Ref AiAccessMode
          ADLM_CLOUD_URL: https://adlmweb.onrender.com
          # These ids are for bedrock-MANTLE (the AnthropicBedrockMantle client in
          # src/clients/bedrock.js), NOT bedrock-runtime. The two endpoints have
          # different model-id spaces: inference-profile ids ("us."/"global." prefixed)
          # are a bedrock-runtime concept and Mantle returns 404 not_found for them.
          # Probed against this account on 2026-08-15 — these bare ids are the only
          # ones Mantle recognises (they return 403 permission_error, i.e. known but
          # not granted; every "us."-prefixed variant returned 404).
          #
          # BLOCKED: "anthropic.claude-haiku-4-5 is not available for this account."
          # Bedrock model access must be granted (Bedrock console -> us-east-1 ->
          # Model access -> Anthropic Claude) before any AI call can succeed.
          BEDROCK_MODEL_CHEAP: anthropic.claude-haiku-4-5
          BEDROCK_MODEL_STRONG: anthropic.claude-sonnet-5
          CREDIT_TOTAL_USD: "25000"
          CREDIT_EXPIRY_DATE: "2028-07-31"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock-mantle:CreateInference
              Resource: "*"
            - Effect: Allow
              Action:
                - textract:AnalyzeDocument
              Resource: "*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # Drift alarms — the credit guard caps disasters; these catch drift early.
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: adlm-ai-service Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AiServiceFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
