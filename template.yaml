AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ADLM AI Service - serverless AI API for the ADLM product suite

Globals:
  Function:
    Timeout: 120
    MemorySize: 1024
    Runtime: nodejs20.x

Parameters:
  MongoUri:
    Type: String
    NoEcho: true
  RategenMongoUri:
    Type: String
    NoEcho: true
    Default: ""
    Description: Zone-priced RateGen admin cluster (read-only grounding).
  JwtLicenseSecret:
    Type: String
    NoEcho: true
    Default: ""
  JwtAccessSecret:
    Type: String
    NoEcho: true
    Default: ""
  AdminApiKey:
    Type: String
    NoEcho: true
  AiProvider:
    Type: String
    # bedrock: model access was granted to this account in us-east-1 on
    # 2026-07-29, so the option we want is now also the option that works.
    # Calls bill the AWS Activate credit instead of cash and no provider key is
    # held anywhere.
    #
    # The rule that produced the earlier default still stands: this must name
    # the option that WORKS. Defaulting to bedrock before the grant took the
    # whole service down on 2026-07-29 — every feature returned
    # 503 MODEL_UNAVAILABLE and a deploy without an explicit override silently
    # picked it up. If the grant is ever revoked, or this stack is deployed to
    # an account or region without it, put this back to anthropic first.
    #
    # Four places carry this setting and must move together: here,
    # samconfig.toml's AiProvider override, src/config/index.js (local dev
    # default), and .env (local dev override).
    Default: bedrock
    AllowedValues: [anthropic, bedrock]
    Description: >-
      bedrock = production. Model calls bill against the AWS Activate credit and
      the Lambda role's bedrock:InvokeModel policy below, so no provider API key
      is held anywhere. REQUIRES model access granted in the Bedrock console for
      this region — granted us-east-1 on 2026-07-29 — otherwise every call
      returns 503 MODEL_UNAVAILABLE. anthropic = direct-API fallback; it bills
      cash, not credit.
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ""
  AiAccessMode:
    Type: String
    Default: any-subscription
    AllowedValues: [any-subscription, entitlement]
    Description: >-
      Who gets AI access. any-subscription = any ACTIVE ADLM entitlement (current
      policy while AI is being built out; spend is bounded by quotas and the credit
      guard). entitlement = only the `ai` add-on. Both require an active,
      unexpired entitlement. Flip this without a code change when AI is priced.
  AlarmEmail:
    Type: String
    Default: dolapo836@gmail.com

Resources:
  AiServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: adlm-ai-service
      Handler: src/lambda.handler
      Environment:
        Variables:
          MONGO_URI: !Ref MongoUri
          RATEGEN_MONGO_URI: !Ref RategenMongoUri
          AI_DB: adlm_ai
          JWT_LICENSE_SECRET: !Ref JwtLicenseSecret
          JWT_ACCESS_SECRET: !Ref JwtAccessSecret
          ADMIN_API_KEY: !Ref AdminApiKey
          AI_PROVIDER: !Ref AiProvider
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          AI_ACCESS_MODE: !Ref AiAccessMode
          ADLM_CLOUD_URL: https://adlmweb.onrender.com
          BEDROCK_MODEL_CHEAP: anthropic.claude-haiku-4-5
          BEDROCK_MODEL_STRONG: anthropic.claude-sonnet-5
          CREDIT_TOTAL_USD: "25000"
          CREDIT_EXPIRY_DATE: "2028-07-31"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock-mantle:CreateInference
              Resource: "*"
            - Effect: Allow
              Action:
                - textract:AnalyzeDocument
              Resource: "*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # Drift alarms — the credit guard caps disasters; these catch drift early.
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: adlm-ai-service Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AiServiceFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
