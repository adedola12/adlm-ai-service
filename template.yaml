AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ADLM AI Service - serverless AI API for the ADLM product suite

Globals:
  Function:
    Timeout: 120
    MemorySize: 1024
    Runtime: nodejs20.x

Parameters:
  MongoUri:
    Type: String
    NoEcho: true
  RategenMongoUri:
    Type: String
    NoEcho: true
    Default: ""
    Description: Zone-priced RateGen admin cluster (read-only grounding).
  JwtLicenseSecret:
    Type: String
    NoEcho: true
    Default: ""
  JwtAccessSecret:
    Type: String
    NoEcho: true
    Default: ""
  AdminApiKey:
    Type: String
    NoEcho: true
  AiProvider:
    Type: String
    # bedrock is the default again, which is only safe because the service now
    # falls back on its own (see src/clients/bedrock.js). The history is worth
    # keeping: defaulting to bedrock took the whole service down on 2026-07-29
    # — every feature returned 503 MODEL_UNAVAILABLE because model access was
    # never granted — so the default was reverted to anthropic. That left the
    # prepaid API key as the single point of failure, and on 2026-08-14 QUIV
    # and RateGen users got "AI service is unreachable" on every prompt.
    # Neither provider is dependable enough to be the only one. The service now
    # leads with bedrock and re-runs on the direct API when Bedrock refuses the
    # model, so a missing grant costs cash instead of costing an outage.
    # Set AI_PROVIDER_FALLBACK=false when you want to PROVE the grant works
    # rather than have the fallback quietly paper over it.
    Default: bedrock
    AllowedValues: [anthropic, bedrock]
    Description: >-
      Which provider is tried FIRST. bedrock = production target: calls bill
      against the AWS Activate credit and authenticate with the Lambda role's
      bedrock policy below, so no provider API key is load-bearing. It needs
      Anthropic model access granted in the Bedrock console for this region;
      without the grant the service serves from the direct API instead and says
      so on GET /health/ai. anthropic = pin every call to the direct API, which
      bills cash rather than credit.
  AiProviderFallback:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Whether a Bedrock model-access refusal automatically re-runs the call on
      the direct Anthropic API (needs AnthropicApiKey). true = an ungranted
      model costs cash instead of costing an outage. false = the refusal
      surfaces as 503 MODEL_UNAVAILABLE, which is what you want while proving
      the Bedrock grant is actually in place.
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      Fallback credential, no longer the primary path. Keep it funded: it is
      what serves QUIV, HERON and RateGen if the Bedrock grant lapses.
  AiAccessMode:
    Type: String
    Default: any-subscription
    AllowedValues: [any-subscription, entitlement]
    Description: >-
      Who gets AI access. any-subscription = any ACTIVE ADLM entitlement (current
      policy while AI is being built out; spend is bounded by quotas and the credit
      guard). entitlement = only the `ai` add-on. Both require an active,
      unexpired entitlement. Flip this without a code change when AI is priced.
  AlarmEmail:
    Type: String
    Default: dolapo836@gmail.com

Resources:
  AiServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: adlm-ai-service
      Handler: src/lambda.handler
      Environment:
        Variables:
          MONGO_URI: !Ref MongoUri
          RATEGEN_MONGO_URI: !Ref RategenMongoUri
          AI_DB: adlm_ai
          JWT_LICENSE_SECRET: !Ref JwtLicenseSecret
          JWT_ACCESS_SECRET: !Ref JwtAccessSecret
          ADMIN_API_KEY: !Ref AdminApiKey
          AI_PROVIDER: !Ref AiProvider
          AI_PROVIDER_FALLBACK: !Ref AiProviderFallback
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          AI_ACCESS_MODE: !Ref AiAccessMode
          ADLM_CLOUD_URL: https://adlmweb.onrender.com
          BEDROCK_MODEL_CHEAP: anthropic.claude-haiku-4-5
          BEDROCK_MODEL_STRONG: anthropic.claude-sonnet-5
          CREDIT_TOTAL_USD: "25000"
          CREDIT_EXPIRY_DATE: "2028-07-31"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock-mantle:CreateInference
              Resource: "*"
            - Effect: Allow
              Action:
                - textract:AnalyzeDocument
              Resource: "*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # Drift alarms — the credit guard caps disasters; these catch drift early.
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: adlm-ai-service Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AiServiceFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
